name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Custom Snake SVGs
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # 1. Classic Light Mode
            dist/github-contribution-grid-snake.svg
            
            # 2. Sleek Dark Mode (Matches default GitHub Dark perfectly)
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
            # 3. Premium Cyberpunk/Ice Theme (Custom Hex Codes)
            dist/github-contribution-grid-snake-cyberpunk.svg?color_snake=#ff007f&color_dots=#161b22,#00f0ff,#00b8d4,#007c91,#004349

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
